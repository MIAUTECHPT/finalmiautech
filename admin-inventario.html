<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel Admin Cloud - MiautechPT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-light p-3 p-md-5">
    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 900px;">
        <h2 class="fw-bold mb-4 text-primary"><i class="fa-solid fa-cloud me-2"></i>Gestão de Inventário na Nuvem</h2>
        
        <!-- ALTERAR STOCK TOTAL -->
        <div class="card p-3 mb-4 bg-light border-0">
            <label for="totalKits" class="form-label fw-bold">Número Total de Kits em Stock na MiautechPT:</label>
            <div class="d-flex gap-2">
                <input type="number" id="totalKits" class="form-control" style="width: 120px;" value="3" min="1">
                <button class="btn btn-primary" onclick="salvarStock()">Guardar Stock</button>
            </div>
        </div>

        <!-- ADICIONAR RESERVA CONFIRMADA -->
        <h4 class="fw-bold mb-3">Adicionar Nova Reserva (Bloquear Datas)</h4>
        <form id="formAdmin" onsubmit="adicionarReserva(event)" class="row g-3 mb-4">
            <div class="col-md-5">
                <label class="form-label">Nome do Cliente</label>
                <input type="text" id="adminNome" class="form-control" required placeholder="Ex: Ana Costa">
            </div>
            <div class="col-md-3">
                <label class="form-label">Data Entrega</label>
                <input type="date" id="adminEntrega" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Data Devolução</label>
                <input type="date" id="adminDevolucao" class="form-control" required>
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-success w-100" title="Adicionar"><i class="fa-solid fa-plus"></i></button>
            </div>
        </form>

        <!-- LISTA DE RESERVAS DA NUVEM -->
        <h4 class="fw-bold mb-3">Reservas Registadas na Nuvem</h4>
        <div class="table-responsive">
            <table class="table table-striped border">
                <thead class="table-dark">
                    <tr>
                        <th>Cliente</th>
                        <th>Entrega</th>
                        <th>Devolução</th>
                        <th class="text-center">Ação</th>
                    </tr>
                </thead>
                <tbody id="tabelaReservas">
                    <tr><td colspan="4" class="text-center">A carregar dados da nuvem...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- FIREBASE SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABrd9CBg1i2TQoybqNrXbx-NOZPaUAaok",
            authDomain: "miautechpt.firebaseapp.com",
            databaseURL: "https://miautechpt-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "miautechpt",
            storageBucket: "miautechpt.firebasestorage.app",
            messagingSenderId: "178436092597",
            appId: "1:178436092597:web:70ddc25324d9984b8044fc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;

        carregarDadosAdmin();
    </script>

    <script>
        async function carregarDadosAdmin() {
            try {
                const stockSnap = await window.getDoc(window.doc(window.db, "configuracao", "stock"));
                if (stockSnap.exists()) {
                    document.getElementById('totalKits').value = stockSnap.data().totalKits;
                }
            } catch(e) { console.error("Erro ao carregar stock:", e); }

            renderTabela();
        }

        async function renderTabela() {
            const tbody = document.getElementById('tabelaReservas');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center">A carregar...</td></tr>';
            
            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "reservas"));
                tbody.innerHTML = '';

                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Nenhuma reserva registada na nuvem.</td></tr>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const res = docSnap.data();
                    tbody.innerHTML += `
                        <tr>
                            <td>${res.cliente}</td>
                            <td>${res.entrega}</td>
                            <td>${res.devolucao}</td>
                            <td class="text-center">
                                <button class="btn btn-danger btn-sm" onclick="removerReserva('${docSnap.id}')">
                                    <i class="fa-solid fa-trash me-1"></i> Eliminar
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) {
                console.error("Erro ao carregar reservas:", e);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Erro ao carregar reservas da nuvem.</td></tr>';
            }
        }

        async function salvarStock() {
            const qtd = parseInt(document.getElementById('totalKits').value) || 1;
            try {
                await window.setDoc(window.doc(window.db, "configuracao", "stock"), { totalKits: qtd });
                alert('Stock guardado com sucesso na nuvem!');
            } catch(e) {
                alert('Erro ao guardar o stock.');
            }
        }

        async function adicionarReserva(e) {
            e.preventDefault();
            const cliente = document.getElementById('adminNome').value;
            const entrega = document.getElementById('adminEntrega').value;
            const devolucao = document.getElementById('adminDevolucao').value;

            try {
                await window.addDoc(window.collection(window.db, "reservas"), { cliente, entrega, devolucao });
                document.getElementById('formAdmin').reset();
                renderTabela();
            } catch(e) {
                alert('Erro ao guardar a reserva.');
            }
        }

        async function removerReserva(id) {
            if (confirm("Tem a certeza que deseja eliminar esta reserva?")) {
                try {
                    await window.deleteDoc(window.doc(window.db, "reservas", id));
                    renderTabela();
                } catch(e) {
                    alert('Erro ao remover a reserva.');
                }
            }
        }
    </script>
</body>
</html>
